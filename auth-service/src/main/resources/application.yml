server:
  port: 9000
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres-auth:5432/authdb
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:/db/migration
  data:
    redis:
      host: redis
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: abc123@gmail.com
    password: kfgkdj3543l4kfdgfd654
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
twilio:
  sid: dsf7fydf87sf68sdfsd7fdshfsdf68df6s
  token: 4olfdusiaidf78sd6as8d7adsdhiadfs
  number: ++18141234567
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
logging:
  level:
    '[org.springframework.security]': debug
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    # SMTP is often unreachable in local Compose; don't mark the whole service DOWN.
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha