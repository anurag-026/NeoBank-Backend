apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: banking-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: yourdockerhub/auth-service:latest
          ports:
            - containerPort: 9000
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-auth:5432/authdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: REDIS_HOST
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: banking-system
spec:
  selector:
    app: auth-service
  ports:
    - port: 9000
      targetPort: 9000