version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  redis: 
    image: redis:8 
    container_name: redis 
    ports: 
      - "6379:6379" 
    networks: 
      - banking-network

  config-server: 
    build: ./config-server 
    ports: 
      - "8888:8888" 
    networks: 
      - banking-network

  eureka-server: 
    build: ./eureka-server 
    ports: 
      - "8761:8761" 
    depends_on: 
      - config-server 
    networks: 
      - banking-network

  auth-service: 
    build: ./auth-service 
    ports: 
      - "9000:9000" 
    depends_on: 
      - postgres-auth 
      - redis 
      - eureka-server 
    networks: 
      - banking-network

  customer-service: 
    build: ./customer-service 
    ports: 
      - "8082:8082" 
    depends_on: 
      - redis 
      - eureka-server 
    networks: 
      - banking-network

  account-service: 
    build: ./account-service 
    ports: 
      - "8083:8083" 
    depends_on: 
      - kafka 
      - redis 
      - eureka-server 
    networks: 
      - banking-network

  transaction-service: 
    build: ./transaction-service 
    ports: 
      - "8084:8084" 
    depends_on: 
      - kafka 
      - eureka-server 
    networks: 
      - banking-network

  api-gateway: 
    build: ./api-gateway 
    ports: 
      - "8080:8080" 
    depends_on: 
      - auth-service 
      - customer-service 
      - account-service 
      - transaction-service 
    networks: 
      - banking-network


  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  #logstash:
   # image: docker.elastic.co/logstash/logstash:8.15.0
  #  ports:
   #    - "5000:5000"
 #    volumes:
 #      - ./logstash.config:/usr/share/logstash/pipeline/logstash.config
 #  elasticsearch:
 #    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
  #   environment:
  #     - discovery.type=single-node
 #      - xpack.security.enabled=false
 #    ports:
  #     - "9200:9200"
 #  kibana: 
 #    image: docker.elastic.co/kibana/kibana:8.15.0 
#     ports: 
 #      - "5601:5601" 
 #    environment: 
 #      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  postgres-account:
    image: postgres:17.9
    container_name: postgres-account
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata-account:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-customer:
    image: postgres:17.9
    container_name: postgres-customer
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - pgdata-customer:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-auth:
    image: postgres:17.9
    container_name: postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-transaction:
    image: postgres:17.9
    container_name: postgres-transaction
    environment:
      POSTGRES_DB: transactiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5435:5432"
    volumes:
      - pgdata-transaction:/var/lib/postgresql/data
    networks:
      - banking-network

volumes:
  pgdata-account:
  pgdata-customer:
  pgdata-auth:
  pgdata-transaction:
networks:
  banking-network:
    driver: bridge