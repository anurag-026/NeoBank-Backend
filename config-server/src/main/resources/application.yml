server:
  port: 8888
spring:
  application:
    name: config-server
  security:
    user:
      name: configadmin
      password: config@123
  cloud:
    config:
      server:
        git:
          uri: https://github.com/HindiCodeClass/banking-config-repo
          default-label: main
          clone-on-start: true
          timeout: 10
management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - metrics
        - prometheus
  metrics:
    tags:
      application: ${spring.application.name}