server:
  port: 8082
spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://postgres-customer:5432/customerdb
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:9000/oauth2/jwks
  cache: 
    type: redis 
    redis: 
      time-to-live: 300000 
  data: 
    redis: 
      host: redis 
      port: 6379
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
