server:
  port: 8082
spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://postgres-customer:5432/customerdb
    username: db_username
    password: db_password
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:9000/oauth2/jwks
  cache: 
    type: redis 
    redis: 
      time-to-live: 300000 
  data: 
    redis: 
      host: redis 
      port: 6379
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
